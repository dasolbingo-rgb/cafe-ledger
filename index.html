.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.sub{color:var(--sub);font-size:13px}
.big{font-size:28px;font-weight:700}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--accent2);color:var(--accent)}
button.icon{background:none;color:var(--sub);padding:6px 10px;font-size:18px}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:48px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;color:var(--sub);border-radius:0;padding:14px 4px;font-size:14px}
.tabs button.on{color:var(--accent);font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.amt{font-weight:600;white-space:nowrap}
.bar{height:8px;background:var(--accent2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.alert{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--accent2);color:var(--accent);padding:8px 12px;font-size:14px}
.chips button.on{background:var(--accent);color:#fff}
.hide{display:none}
.money{position:relative;flex:1;min-width:0}
.money input{padding-right:34px;text-align:right}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:10px}
.amt2{font-weight:700;font-size:17px;word-break:keep-all}
.tr{display:flex;gap:4px;align-items:flex-end}
.tc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.pair{display:flex;gap:3px;align-items:flex-end;height:96px}
.pair i{display:block;width:13px;border-radius:3px 3px 0 0;min-height:2px}
.s{background:var(--ok)}.e{background:var(--accent)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 0;vertical-align:-1px}
.tc .m{font-size:12px;margin-top:4px}
.tc .nt{font-size:11px;margin-top:1px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.grid.dow span{text-align:center;font-size:12px;color:var(--sub)}
.cell{min-height:54px;border-radius:8px;background:var(--bg);padding:4px 2px;text-align:center;font-size:13px;cursor:pointer;border:1.5px solid transparent;position:relative}
.cell.blank{background:none;cursor:default}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--accent2)}
.cell .n{font-weight:600}
.cell .v{display:block;font-size:10px;color:var(--accent);margin-top:2px;word-break:keep-all}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell .dot{position:absolute;top:4px;right:4px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>☕ 카페 가계부</h1>

  <!-- 홈 -->
  <section id="v-home">
    <div id="bkbar"></div>
    <div id="alerts"></div>
    <div class="card">
      <div class="row"><button class="icon" id="prev">‹</button><div class="sp" style="text-align:center;font-weight:700" id="mlabel"></div><button class="icon" id="next">›</button></div>
      <div class="sum3">
        <div><div class="sub">매출</div><div class="amt2" id="msales">-</div></div>
        <div><div class="sub">지출</div><div class="amt2" id="mtotal">0원</div></div>
        <div><div class="sub">남은 돈</div><div class="amt2" id="mnet">-</div></div>
      </div>
      <div style="margin-top:12px"><button class="ghost" id="seditbtn" style="width:100%">이달 매출 입력</button></div>
      <div id="sedit" class="hide" style="margin-top:8px"><div class="row"><input id="s-amt" type="text" inputmode="numeric" placeholder="이달 총 매출"><button id="s-save" style="white-space:nowrap">저장</button></div></div>
    </div>
    <div class="card"><div style="font-weight:600">월별 추이</div><div class="sub" style="margin:2px 0 8px"><span class="lg s"></span>매출 <span class="lg e"></span>지출</div><div id="trend"></div></div>
    <div class="card"><div style="font-weight:600;margin-bottom:6px">항목별</div><div id="bycat"></div></div>
    <div class="card"><div class="row"><div style="font-weight:600" id="lhead">내역</div><div class="sp"></div><button class="ghost hide" id="lclear" style="padding:6px 10px;font-size:13px">전체 보기</button></div><div id="lsum"></div><div id="list"></div></div>
  </section>

  <!-- 달력 -->
  <section id="v-cal" class="hide">
    <div class="card">
      <div class="row"><button class="icon" id="cprev">‹</button><div class="sp" style="text-align:center"><div style="font-weight:700" id="clabel"></div><div class="sub" id="ctotal"></div></div><button class="icon" id="cnext">›</button></div>
      <div class="grid dow"><span style="color:var(--warn)">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span style="color:var(--accent)">토</span></div>
      <div class="grid" id="cgrid"></div>
      <div class="sub" style="margin-top:8px"><span class="dot"></span> 고정비 나가는 날</div>
    </div>
    <div class="card"><div style="font-weight:600" id="dlabel"></div><div id="dlist"></div></div>
  </section>

  <!-- 입력 -->
  <section id="v-add" class="hide">
    <div class="card">
      <div id="fav-box" class="hide"><div class="row"><span class="sub sp">자주 쓰는 지출</span><button class="icon" id="fav-manage" style="font-size:13px">관리</button></div><div class="chips" id="favs" style="margin-top:4px"></div></div>
      <label>금액 (원)</label>
      <input id="a-amt" type="text" inputmode="numeric" placeholder="0">
      <label>항목</label>
      <div class="chips" id="a-cats"></div>
      <div class="row"><label class="sp">지출처 (선택)</label><button class="icon" id="ven-manage" style="font-size:13px">관리</button></div>
      <div class="chips" id="vens"></div>
      <div id="ven-edit" class="hide" style="margin-top:8px"></div>
      <div id="a-person-box" class="hide"><label>직원 이름</label><input id="a-person" placeholder="예: 김민지"></div>
      <label>메모 (선택)</label>
      <input id="a-memo" placeholder="예: 원두 2kg">
      <label>날짜</label>
      <input id="a-date" type="date">
      <div style="margin-top:14px"><button id="a-save" style="width:100%">저장</button></div>
      <div style="margin-top:8px"><button class="ghost" id="fav-save" style="width:100%">☆ 자주 쓰는 지출로 저장</button></div>
    </div>
  </section>

  <!-- 고정비 -->
  <section id="v-fixed" class="hide">
    <div class="card"><div class="sub" id="fsum"></div><div id="flist"></div></div>
    <div class="card">
      <div style="font-weight:600">고정비 추가</div>
      <label>이름</label><input id="f-name" placeholder="예: 월세, 음저협 공연사용료">
      <label>금액 (원)</label><input id="f-amt" type="text" inputmode="numeric" placeholder="0">
      <label>매달 결제일 (1~31)</label><input id="f-day" type="number" inputmode="numeric" min="1" max="31">
      <label>항목</label><select id="f-cat"></select>
      <div style="margin-top:14px"><button id="f-save" style="width:100%">추가</button></div>
    </div>
  </section>

  <!-- 정산 -->
  <section id="v-report" class="hide">
    <div class="card">
      <div class="row"><button class="icon" id="yprev">‹</button><div class="sp" style="text-align:center;font-weight:700" id="ylabel"></div><button class="icon" id="ynext">›</button></div>
      <div class="chips" id="pchips" style="margin-top:10px;justify-content:center"></div>
      <div class="sum3">
        <div><div class="sub">매출</div><div class="amt2" id="rsales">-</div></div>
        <div><div class="sub">지출</div><div class="amt2" id="rexp">0원</div></div>
        <div><div class="sub">남은 돈</div><div class="amt2" id="rnet">-</div></div>
      </div>
      <div class="sub" id="rnote" style="margin-top:8px;text-align:center"></div>
    </div>
    <div class="card"><div style="font-weight:600;margin-bottom:4px">월별</div><div id="rmonths"></div></div>
    <div class="card"><div style="font-weight:600;margin-bottom:4px">항목별 지출</div><div id="rcats"></div></div>
    <div class="card"><div style="font-weight:600;margin-bottom:4px">지출처별</div><div id="rvens"></div></div>
    <div class="card"><div style="font-weight:600">백업</div><div class="sub" style="margin:2px 0 8px">기록은 이 폰에만 저장돼요. 가끔 파일로 저장해 두면 폰을 바꿔도 옮길 수 있어요</div><div class="row"><button class="ghost sp" id="bk-save">백업 저장</button><button class="ghost sp" id="bk-load">불러오기</button></div><div class="sub" id="bk-last" style="margin-top:6px;text-align:center"></div><input type="file" id="bk-file" accept=".json,application/json" class="hide"><div class="sub" id="bk-msg" style="margin-top:6px;text-align:center"></div></div>
    <div class="card"><button id="r-csv" style="width:100%">엑셀(CSV)로 받기</button><div class="sub" id="r-msg" style="margin-top:6px;text-align:center">선택한 기간의 월별 요약과 지출 내역 전체가 들어가요</div></div>
  </section>

  <div class="note" id="status"></div>
</div>

<nav class="tabs">
  <button data-v="home" class="on">홈</button>
  <button data-v="cal">달력</button>
  <button data-v="add">+ 입력</button>
  <button data-v="fixed">고정비</button>
  <button data-v="report">정산</button>
</nav>

<script>
/* 독립 실행(깃허브 페이지)용: 서버 저장은 없고, 파일 저장은 공유창/다운로드로 처리 */
window.claude={use:async n=>n==="downloads"?{save:async({filename,data})=>{
  const type=filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json";
  const b=data instanceof Blob?data:new Blob([data],{type});
  const f=new File([b],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:filename});return{status:"saved"}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}
  }
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:"saved"};
}}:null};
</script>
<script>
const CATS=["원두·재료","포장·소모품","임대료","공연사용료","공과금","인건비","수수료","기타"];
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const monthKey=d=>d.slice(0,7);
let curMonth=monthKey(today());
let expenses=[],fixed=[],cat=CATS[0],catFilter=null,sales={},favs=[],favManage=false,vendors=[],venSel="",venManage=false;
let store=null; // {expCol, fixCol} or null → localStorage

/* ---------- 저장소: db 우선, 없으면 이 기기 localStorage ---------- */
const LS="cafe-ledger-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{expenses:[],fixed:[]}}catch(e){return{expenses:[],fixed:[]}}}
const META="cafe-ledger-meta";
function getMeta(){try{return JSON.parse(localStorage.getItem(META))||{}}catch(e){return{}}}
function setMeta(o){try{localStorage.setItem(META,JSON.stringify({...getMeta(),...o}))}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({expenses,fixed,sales,favs,vendors}))}catch(e){}}
function rowsOf(snap){
  const out=[];
  const docs=snap&&(snap.docs||snap);
  if(docs&&docs.forEach)docs.forEach(d=>{const v=typeof d.data==="function"?d.data():d;out.push({...v,id:d.id||v.id})});
  return out;
}
const PRE={expCol:"exp_",fixCol:"fix_",favCol:"fav_",venCol:"ven_"};
const arrOf=k=>k==="expCol"?expenses:k==="fixCol"?fixed:k==="favCol"?favs:vendors;
function setArr(k,a){if(k==="expCol")expenses=a;else if(k==="fixCol")fixed=a;else if(k==="favCol")favs=a;else vendors=a}
async function put(kind,obj){
  if(store){await store.col.doc(PRE[kind]+obj.id).set(obj)}
  else{const arr=arrOf(kind);const i=arr.findIndex(x=>x.id===obj.id);i<0?arr.push(obj):arr[i]=obj;lsSave();render()}
}
async function del(kind,id){
  if(store){await store.col.doc(PRE[kind]+id).delete()}
  else{setArr(kind,arrOf(kind).filter(x=>x.id!==id));lsSave();render()}
}
const etitle=e=>[e.person,e.memo].filter(Boolean).join(" · ")||e.cat;
async function putSales(m,v){
  if(store){await store.col.doc("sales_"+m).set({month:m,amount:v})}
  else{sales[m]=v;lsSave();render()}
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- 렌더 ---------- */
function render(){
  $("mlabel").textContent=curMonth.replace("-","년 ")+"월";
  const mine=expenses.filter(e=>monthKey(e.date)===curMonth).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const exp=mine.reduce((s,e)=>s+e.amount,0),sl=sales[curMonth];
  $("mtotal").textContent=won(exp);
  $("msales").textContent=sl==null?"-":won(sl);
  const net=$("mnet");
  if(sl==null){net.textContent="-";net.style.color=""}
  else{net.textContent=(sl-exp>=0?"+":"-")+won(Math.abs(sl-exp));net.style.color=sl-exp>=0?"var(--ok)":"var(--warn)"}
  $("seditbtn").textContent=sl==null?"이달 매출 입력":"매출 수정";
  renderTrend();

  const by={};mine.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const tot=Object.values(by).reduce((a,b)=>a+b,0)||1;
  const bc=$("bycat");bc.textContent="";
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!ents.length){bc.innerHTML='<div class="sub">아직 기록이 없어요</div>'}
  ents.forEach(([k,v])=>{
    const d=document.createElement("div");d.style.margin="4px 0";d.style.padding="4px 6px";d.style.borderRadius="8px";d.style.cursor="pointer";
    if(k===catFilter)d.style.background="var(--accent2)";
    d.onclick=()=>{catFilter=catFilter===k?null:k;render()};
    const r=document.createElement("div");r.className="row";
    const a=document.createElement("span");a.textContent=k;
    const s=document.createElement("span");s.className="sp";
    const b=document.createElement("span");b.className="amt";b.textContent=won(v)+" · "+Math.round(v/tot*100)+"%";
    r.append(a,s,b);
    const bar=document.createElement("div");bar.className="bar";const i=document.createElement("i");i.style.width=(v/tot*100)+"%";bar.append(i);
    d.append(r,bar);bc.append(d);
  });

  if(catFilter&&!by[catFilter])catFilter=null;
  const shown=catFilter?mine.filter(e=>e.cat===catFilter):mine;
  $("lhead").textContent=catFilter?catFilter+" "+won(by[catFilter]):"내역";
  $("lclear").classList.toggle("hide",!catFilter);
  const ls=$("lsum");ls.textContent="";
  if(catFilter==="인건비"){
    const pp={};shown.forEach(e=>{const k=e.person||"이름 없음";pp[k]=(pp[k]||0)+e.amount});
    Object.entries(pp).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
      const r=document.createElement("div");r.className="row sub";r.style.padding="2px 0";
      const a=document.createElement("span");a.textContent=k;const s=document.createElement("span");s.className="sp";
      const b=document.createElement("span");b.textContent=won(v);r.append(a,s,b);ls.append(r);
    });
  }
  const l=$("list");l.textContent="";
  if(!shown.length)l.innerHTML='<div class="sub" style="padding:8px 0">+ 입력에서 첫 지출을 적어보세요</div>';
  shown.forEach(e=>{
    const it=document.createElement("div");it.className="item";
    const m=document.createElement("div");m.className="sp";
    const t=document.createElement("div");t.textContent=etitle(e);
    const s=document.createElement("div");s.className="sub";s.textContent=e.date.slice(5).replace("-","/")+" · "+esub(e);
    m.append(t,s);
    const a=document.createElement("div");a.className="amt";a.textContent=won(e.amount);
    const x=document.createElement("button");x.className="icon";x.textContent="✕";
    x.onclick=()=>{if(x.dataset.sure){del("expCol",e.id)}else{x.dataset.sure=1;x.textContent="삭제?";setTimeout(()=>{delete x.dataset.sure;x.textContent="✕"},2500)}};
    it.append(m,a,x);l.append(it);
  });

  renderAlerts();renderFixed();renderCal();renderFavs();renderVendors();renderReport();renderBackup();
}

/* ---------- 지출처 ---------- */
const esub=e=>e.cat+(e.vendor?" · "+e.vendor:"");
function renderVendors(){
  const sorted=vendors.slice().sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  if(venSel&&!sorted.some(v=>v.name===venSel)&&!venManage){/* 삭제된 지출처를 골라 둔 경우도 이번 입력엔 유지 */}
  $("ven-manage").textContent=venManage?"완료":"관리";
  const c=$("vens");c.textContent="";
  c.classList.toggle("hide",venManage);
  if(!sorted.length){const s=document.createElement("div");s.className="sub";s.textContent="오른쪽 '관리'에서 자주 가는 곳(쿠팡, 마트 등)을 추가해 보세요";c.append(s)}
  sorted.forEach(v=>{
    const b=document.createElement("button");b.textContent=v.name;if(v.name===venSel)b.className="on";
    b.onclick=()=>{venSel=venSel===v.name?"":v.name;renderVendors()};
    c.append(b);
  });
  const ed=$("ven-edit");ed.textContent="";
  ed.classList.toggle("hide",!venManage);
  if(!venManage)return;
  sorted.forEach(v=>{
    const r=document.createElement("div");r.className="row";r.style.marginBottom="6px";
    const i=document.createElement("input");i.value=v.name;
    i.onchange=()=>renameVendor(v,i.value.trim());
    const x=document.createElement("button");x.className="icon";x.textContent="✕";
    x.onclick=()=>{if(x.dataset.sure){if(venSel===v.name)venSel="";del("venCol",v.id)}else{x.dataset.sure=1;x.textContent="삭제?";setTimeout(()=>{delete x.dataset.sure;x.textContent="✕"},2500)}};
    r.append(i,x);ed.append(r);
  });
  const ar=document.createElement("div");ar.className="row";
  const ai=document.createElement("input");ai.placeholder="새 지출처 (예: 쿠팡)";
  const ab=document.createElement("button");ab.textContent="추가";ab.style.whiteSpace="nowrap";
  const add=async()=>{
    const n=ai.value.trim();
    if(!n||vendors.some(v=>v.name===n)){ai.focus();return}
    ai.value="";await put("venCol",{id:uid(),name:n});
  };
  ab.onclick=add;ai.onkeydown=e=>{if(e.key==="Enter")add()};
  ar.append(ai,ab);ed.append(ar);
}
async function renameVendor(v,n){
  if(!n||n===v.name||vendors.some(x=>x.name===n)){renderVendors();return}
  const old=v.name;
  await put("venCol",{...v,name:n});
  if(venSel===old)venSel=n;
  for(const e of expenses.filter(x=>x.vendor===old))await put("expCol",{...e,vendor:n});
}

/* ---------- 자주 쓰는 지출 ---------- */
function renderFavs(){
  $("fav-box").classList.toggle("hide",!favs.length);
  $("fav-manage").textContent=favManage?"완료":"관리";
  const c=$("favs");c.textContent="";
  favs.slice().sort((a,b)=>a.name.localeCompare(b.name,"ko")).forEach(f=>{
    const b=document.createElement("button");

const csvCell=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
function buildCsv(){
  const ms=repMonths(),L=[];
  L.push([repYear+"년 "+repPeriod].map(csvCell).join(","));
  L.push(["월","매출","지출","남은 돈"].map(csvCell).join(","));
  ms.forEach(k=>{const e=expenses.filter(x=>monthKey(x.date)===k).reduce((s,x)=>s+x.amount,0),s=sales[k];L.push([Number(k.slice(5))+"월",s==null?"":s,e,s==null?"":s-e].map(csvCell).join(","))});
  L.push("");
  L.push(["항목","지출"].map(csvCell).join(","));
  const by={};expenses.filter(x=>ms.includes(monthKey(x.date))).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>L.push([k,v].map(csvCell).join(",")));
  L.push("");
  L.push(["날짜","항목","지출처","직원","메모","금액"].map(csvCell).join(","));
  expenses.filter(x=>ms.includes(monthKey(x.date))).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>L.push([x.date,x.cat,x.vendor||"",x.person||"",x.memo||"",x.amount].map(csvCell).join(",")));
  return "﻿"+L.join("\r\n");
}

          vendors=rows.filter(r=>r.id&&r.id.startsWith("ven_")&&r.name).map(r=>({...r,id:r.id.slice(4)}));
          sales={};
          rows.filter(r=>r.id&&r.id.startsWith("sales_")&&typeof r.amount==="number").forEach(r=>{sales[r.id.slice(6)]=r.amount});
          render();
        });
        // 이 기기에 임시로 저장돼 있던 기록이 있으면 한 번 옮겨 담기
        const old=lsLoad();
        if(old.expenses.length||old.fixed.length){
          for(const e of old.expenses)await store.col.doc(PRE.expCol+e.id).set(e);
          for(const f of old.fixed)await store.col.doc(PRE.fixCol+f.id).set(f);
          try{localStorage.removeItem(LS)}catch(e){}
        }
        ok=true;
      }
    }
  }catch(e){store=null}
  if(!ok){const d=lsLoad();expenses=d.expenses;fixed=d.fixed;sales=d.sales||{};favs=d.favs||[];vendors=d.vendors||[];$("status").textContent="이 폰에만 저장돼요 · 정산 탭에서 가끔 백업해 두세요"}
  render();
})();
if(typeof claude==="undefined"){window.claude={use:async()=>null}}
</script>
</body>
</html>
